<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infraestrutura | F3F Gestão</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #020817;
      color: #f0f4f8;
    }

    .wrap {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      background: rgba(2, 8, 23, 0.95);
      padding: 16px 0;
      border-bottom: 1px solid #17345d;
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 100;
    }

    .header .wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.3rem;
      font-weight: 800;
      color: #fff;
    }

    .logo span {
      color: #e6c84f;
    }

    .btn-voltar {
      color: #e6c84f;
      text-decoration: none;
      border: 1px solid #e6c84f;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
    }

    .btn-voltar:hover {
      background: #e6c84f;
      color: #020817;
    }

    .hero {
      padding: 120px 0 40px;
      text-align: center;
    }

    .hero h1 {
      font-size: 2.2rem;
    }

    .hero h1 span {
      color: #e6c84f;
    }

    .hero p {
      color: #94a3b8;
      max-width: 600px;
      margin: 16px auto 0;
    }

    .card {
      background: #0b1e3b;
      border: 1px solid #17345d;
      border-radius: 12px;
      padding: 24px;
      margin: 20px 0;
    }

    .card h3 {
      color: #e6c84f;
    }

    .card p {
      color: #94a3b8;
    }

    .btn {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn-wsp {
      background: #25D366;
      color: #fff;
    }

    .btn-wsp:hover {
      transform: translateY(-2px);
    }

    .footer {
      text-align: center;
      padding: 30px 0;
      border-top: 1px solid #17345d;
      color: #94a3b8;
      font-size: 0.85rem;
      margin-top: 40px;
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="wrap">
      <div class="logo">F3F <span>Gestão</span></div>
      <a href="../index.html" class="btn-voltar">← Voltar</a>
    </div>
  </header>
  <section class="hero">
    <div class="wrap">
      <h1>🏗️ Redes e <span>Subestações</span></h1>
      <p>Projetos de infraestrutura elétrica e conexões à rede de média tensão.</p>
    </div>
  </section>
  <div class="wrap">
    <div class="card">
      <h3>🏗️ Infraestrutura Elétrica</h3>
      <p>Projetos completos de redes e subestações para sua empresa.</p>
    </div>
    <div style="text-align:center;margin:30px 0;">
      <a href="https://wa.me/5562992892170?text=Olá!%20Quero%20saber%20sobre%20Infraestrutura" class="btn btn-wsp"
        target="_blank">📱 Falar com Especialista</a>
    </div>
  </div>
  <div class="footer">
    <div class="wrap">© 2026 F3F Gestão Energética | (62) 99289-2170</div>
  </div>
</body>

</html>
